name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK; just accept licenses and add platform 37.
      - name: Install SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs and run tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: worm-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
