<!DOCTYPE html>
<!-- Worm · Wormhole browser page (GPL-3.0-or-later). Served by the phone; nothing leaves your network. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worm · {{NAME}}</title>
<style>
@font-face { font-family: Bricolage; src: url(/font.ttf); }
:root { --bg:#160A21; --card:#261433; --fg:#F4E2F4; --dim:#B9A3BF; --pink:#D552A3; --mint:#98E8DE; --violet:#8E1EA2; }
* { box-sizing: border-box; }
body { margin:0; background: radial-gradient(1200px 600px at 20% -10%, #3A1650, var(--bg)); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; min-height: 100vh; }
header { padding: 28px 24px 8px; display:flex; align-items:center; gap:16px; flex-wrap: wrap; }
h1 { font-family: Bricolage, system-ui; font-size: 32px; margin: 0; }
h1 span { color: var(--mint); }
.sub { color: var(--dim); }
main { padding: 8px 24px 48px; max-width: 1200px; margin: auto; }
#login { max-width: 360px; margin: 12vh auto; text-align:center; }
input[type=text] { font: 600 28px Bricolage, system-ui; letter-spacing: 6px; text-align:center; width: 100%; padding: 14px; border-radius: 18px; border: 2px solid var(--violet); background: var(--card); color: var(--fg); }
button, .btn { font: 600 15px Bricolage, system-ui; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--pink); color: #fff; cursor: pointer; text-decoration: none; display:inline-block; }
button.ghost, .btn.ghost { background: transparent; border: 2px solid var(--mint); color: var(--mint); }
.bar { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin: 12px 0 18px; }
.bar input[type=search] { flex: 1; min-width: 200px; font: 15px system-ui; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--card); color: var(--fg); }
.chip { padding: 6px 14px; border-radius: 999px; background: var(--card); color: var(--dim); cursor:pointer; user-select:none; }
.chip.on { background: var(--mint); color: #003732; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
.book { background: var(--card); border-radius: 20px; overflow:hidden; display:flex; flex-direction:column; }
.cover { aspect-ratio: 2/3; background: linear-gradient(135deg, var(--violet), #3B1052); display:flex; align-items:center; justify-content:center; text-align:center; padding: 10px; font: 700 15px Bricolage, system-ui; }
.book.audio .cover { aspect-ratio: 1; }
.cover img { width:100%; height:100%; object-fit: cover; }
.meta { padding: 10px 12px 12px; display:flex; flex-direction: column; gap: 6px; flex:1; }
.t { font-weight: 700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient: vertical; overflow:hidden; }
.a { color: var(--dim); font-size: 13px; }
.dl { margin-top: auto; font-size: 13px; padding: 7px 12px; text-align:center; }
#drop { border: 2px dashed var(--violet); border-radius: 20px; padding: 18px; text-align:center; color: var(--dim); margin-bottom: 18px; }
#drop.over { border-color: var(--mint); color: var(--mint); }
#ups div { font-size: 13px; color: var(--dim); }
.err { color: #ff8a9a; min-height: 1.4em; }
</style></head>
<body>
<header><h1>Worm<span> · </span>{{NAME}}</h1><div class="sub">through the Wormhole 🪱🌀</div></header>
<main>
  <section id="login" hidden>
    <p>Type the 6-digit code shown in Worm</p>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <p class="err" id="err"></p>
    <button id="go">Come through</button>
  </section>
  <section id="lib" hidden>
    <div id="drop">Drop books or audiobooks here (or <label style="color:var(--mint);cursor:pointer"><input id="pick" type="file" multiple hidden>choose files</label>) to send them to {{NAME}}.<div id="ups"></div></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search title, author, series…">
      <span class="chip on" data-k="all">Everything</span><span class="chip" data-k="book">Books</span><span class="chip" data-k="audio">Audiobooks</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s)
let books = [], kind = 'all'
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const size = n => n > 1e9 ? (n/1e9).toFixed(1)+' GB' : n > 1e6 ? (n/1e6).toFixed(1)+' MB' : Math.round(n/1e3)+' KB'

async function load() {
  const r = await fetch('/api/books')
  if (r.status === 401) { $('#login').hidden = false; $('#lib').hidden = true; return }
  books = (await r.json()).books
  $('#login').hidden = true; $('#lib').hidden = false
  render()
}
function render() {
  const q = $('#q').value.toLowerCase().trim()
  const list = books.filter(b => (kind === 'all' || (kind === 'audio') === b.audio) &&
    (!q || [b.title, ...(b.authors||[]), ...(b.narrators||[]), b.series].join(' ').toLowerCase().includes(q)))
  $('#grid').innerHTML = list.map(b => {
    const files = b.files.length > 1
      ? `<a class="btn dl" href="/zip/${b.id}">Download .zip · ${size(b.size)}</a>`
      : `<a class="btn dl" href="/f/${b.id}/0?dl=1">Download ${esc(b.format.toUpperCase())} · ${size(b.size)}</a>`
    return `<div class="book ${b.audio ? 'audio' : ''}">
      <div class="cover">${b.cover ? `<img loading="lazy" src="/cover/${b.id}" alt="">` : esc(b.title)}</div>
      <div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc((b.authors||[]).join(', '))}${b.series ? ' · ' + esc(b.series) + (b.seriesIndex ? ' #' + b.seriesIndex : '') : ''}</div>${files}</div></div>`
  }).join('') || '<p class="sub">Nothing matches.</p>'
}
$('#q').oninput = render
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); kind = c.dataset.k; render()
})
$('#go').onclick = async () => {
  const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ code: $('#code').value }) })
  if (r.ok) load(); else $('#err').textContent = (await r.json()).error || 'Wrong code'
}
$('#code').onkeydown = e => { if (e.key === 'Enter') $('#go').click() }

async function send(files) {
  if (!files.length) return
  const total = files.reduce((n, f) => n + f.size, 0)
  const wait = document.createElement('div'); wait.textContent = `⏳ Sending ${files.length} file(s), ${size(total)}…`; $('#ups').append(wait)
  // Offer first: nothing is uploaded unless the phone's owner accepts.
  const offer = await (await fetch('/api/offer', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ items: files.map(f => ({ title: f.name, folder: '', files: [{ name: f.name, size: f.size }] })) }) })).json()
  let status = offer.status
  for (let i = 0; status === 'pending' && i < 180; i++) {
    await new Promise(r => setTimeout(r, 1000))
    status = (await (await fetch('/api/offer/' + offer.id)).json()).status
  }
  if (status !== 'accepted') { wait.textContent = '✗ {{NAME}} didn\'t accept the files'; return }
  wait.textContent = '✓ Accepted'
  for (const f of files) {
    const line = document.createElement('div'); line.textContent = '⏳ ' + f.name; $('#ups').append(line)
    const q = `offer=${offer.id}&name=${encodeURIComponent(f.name)}&size=${f.size}`
    const st = await (await fetch('/api/upload/status?' + q)).json()
    if (st.received < 0) { line.textContent = '✓ ' + f.name + ' (already there)'; continue }
    const from = st.received || 0
    const r = await fetch(`/api/upload?${q}&offset=${from}`, { method: 'PUT', body: f.slice(from) })
    line.textContent = (r.ok ? '✓ ' : '✗ ') + f.name
  }
}
const drop = $('#drop')
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over') }
drop.ondragleave = () => drop.classList.remove('over')
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); send([...e.dataTransfer.files]) }
$('#pick').onchange = e => send([...e.target.files])
load()
</script>
</body></html>
