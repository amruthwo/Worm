<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Worm icon, hand-vectorized from design/worm icon.jpg. Coordinates match the Android adaptive-icon 108 grid. -->
  <defs>
    <radialGradient id="bg" cx="54" cy="46" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F6EEFA"/>
      <stop offset="1" stop-color="#E9DAF2"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Book: cover -->
    <path d="M21,64 L24,84 Q38,81 52,86 L56,86 Q70,81 84,84 L87,64 Z" fill="#8E1EA2" stroke="#3B1052" stroke-width="1.6"/>
    <!-- page edges -->
    <path d="M24,66 L26,81 Q40,78 54,83 Q68,78 82,81 L84,66" fill="#B57BD6" stroke="#3B1052" stroke-width="1.2"/>
    <!-- Left page -->
    <path d="M26,58 Q40,55 54,60 L54,80 Q40,75 27,77 Z" fill="#FFFFFF" stroke="#3B1052" stroke-width="1.6"/>
    <!-- Right page -->
    <path d="M82,58 Q68,55 54,60 L54,80 Q68,75 81,77 Z" fill="#FFFFFF" stroke="#3B1052" stroke-width="1.6"/>
    <!-- text lines -->
    <g stroke="#B57BD6" stroke-width="1.3" fill="none">
      <path d="M31,67 Q40,65.5 50,68"/>
      <path d="M31,71 Q40,69.5 50,72"/>
      <path d="M58,63 Q67,61 77,62.5"/>
      <path d="M58,67 Q67,65 77,66.5"/>
      <path d="M58,71 Q67,69 77,70.5"/>
    </g>
    <!-- Worm body: dark outline stroke, then pink tube on top -->
    <path id="body" d="M54,40 C52,47 63,49 63,57 C63,65 55,68 50,64 C47,61.5 44,57 39,58 C34.5,59 33,63 32.5,66"
          fill="none" stroke="#3B1052" stroke-width="11"/>
    <path d="M54,40 C52,47 63,49 63,57 C63,65 55,68 50,64 C47,61.5 44,57 39,58 C34.5,59 33,63 32.5,66"
          fill="none" stroke="#E46FB4" stroke-width="8"/>
    <!-- segment rings -->
    <g stroke="#B83A8C" stroke-width="1.2" fill="none">
      <path d="M57,46.5 Q60,46 61.5,48.5"/>
      <path d="M59.5,53 L66.5,52"/>
      <path d="M59.5,58 L66.8,59.5"/>
      <path d="M57.5,62 L62,67"/>
      <path d="M44,56 L42.5,62.5"/>
      <path d="M38.5,54.5 L39,62"/>
    </g>
    <!-- belly highlight -->
    <path d="M60.5,52 C61.5,56 61,60 58.5,62.5" fill="none" stroke="#F7A6D4" stroke-width="1.4"/>
    <!-- Head -->
    <ellipse cx="54" cy="33" rx="8.5" ry="9" fill="#E46FB4" stroke="#3B1052" stroke-width="1.6"/>
    <ellipse cx="51.2" cy="30.5" rx="1.1" ry="1.6" fill="#3B1052" stroke="none"/>
    <ellipse cx="56.8" cy="30.5" rx="1.1" ry="1.6" fill="#3B1052" stroke="none"/>
    <path d="M50.5,35 Q54,38.5 57.5,35" fill="none" stroke="#3B1052" stroke-width="1.4"/>
    <ellipse cx="49" cy="34.4" rx="1.4" ry="0.8" fill="#F7A6D4" stroke="none"/>
    <ellipse cx="59" cy="34.4" rx="1.4" ry="0.8" fill="#F7A6D4" stroke="none"/>
    <!-- Headphones -->
    <path d="M43.5,33 C43.5,19 64.5,19 64.5,33" fill="none" stroke="#3B1052" stroke-width="3.2"/>
    <rect x="41" y="28.5" width="5.2" height="10" rx="2.6" fill="#98E8DE" stroke="#3B1052" stroke-width="1.6"/>
    <rect x="61.8" y="28.5" width="5.2" height="10" rx="2.6" fill="#98E8DE" stroke="#3B1052" stroke-width="1.6"/>
    <!-- Sound waves -->
    <g stroke="#98E8DE" stroke-width="2" fill="none">
      <path d="M71,30 Q73,33.5 71,37"/>
      <path d="M74.5,27 Q78,33.5 74.5,40"/>
      <path d="M78,24 Q83,33.5 78,43"/>
    </g>
  </g>
</svg>
